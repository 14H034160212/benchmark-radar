# Source-verified release and first-score dates absent from catalog crawls.
# Exact source keys preserve the catalog's one-record-per-source population.
# Prefer an explicit public release announcement; otherwise use the first
# version of the paper that introduces this specific benchmark or partition.
# Never date a benchmark from a Hub card's creation, a crawl, an arbitrary
# README citation, or a newer model's release. Sources checked 2026-09-07.
# Existing source-provided releases take precedence over this missing-data fill.
# First-score evidence verifies a dated numeric report when a release day is
# unknown. These isolated historical results are not an aggregator score series
# or a claim about a benchmark's highest score, and never enter Pareto ranking.
